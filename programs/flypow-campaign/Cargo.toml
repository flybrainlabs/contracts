[package]
name = "flypow-campaign-program"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
solana-program = "=3.0.0"
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }
spl-token = { version = "=9.0.0", features = ["no-entrypoint"] }
borsh = { version = "=1.8.1", features = ["derive"] }
flypow-campaign-core = { path = "../../crates/campaign-core" }
flypow-receipt-v1 = { path = "../../crates/receipt-v1" }
flypow-task-catalog = { path = "../../crates/task-catalog" }

